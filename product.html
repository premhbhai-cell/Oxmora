<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details | Oxmora</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="topbar"></div><header class="header"></header>
<main class="wrap" style="padding-top:18px"><p style="font-size:13px;color:#6e7b8d"><a href="index.html">Home</a> / <a href="products.html">Products</a> / <span id="bc"></span></p>
<section class="box pd" id="pd"></section>
<section class="box"><div class="feat"><div><b>🎁</b><strong>Great Gift</strong>Colourful toys kids love</div><div><b>🚚</b><strong>Delivery</strong>Ask Oxmora for delivery to your city</div><div><b>🔒</b><strong>Safe Payment</strong>Confirm order on WhatsApp</div><div><b>✅</b><strong>Genuine Product</strong>Supplied by Oxmora, Ludhiana</div></div></section>
<section class="box"><div class="tabs" id="tabs"><button class="on" data-t="0">Description</button><button data-t="1">Specifications</button><button data-t="2">Shipping &amp; Support</button></div><div id="tp"></div></section>
<section class="box" id="rv"><div class="sh"><h2>Customer Reviews</h2></div><div id="rsum"></div></section>
<section class="box"><div class="sh"><h2>Frequently Asked Questions</h2></div><div id="faq"></div></section>
<section class="box"><div class="sh"><h2>Related Products</h2><a href="products.html">View All →</a></div><div class="hs" id="rel"></div></section>
<section class="box" id="rvbox" style="display:none"><div class="sh"><h2>Recently Viewed</h2></div><div class="hs" id="recent"></div></section>
</main><footer class="footer"></footer><script src="products.js"></script><script src="store.js"></script>
<script>
window.initPage=()=>{const P=OXMORA_PRODUCTS,$=i=>document.getElementById(i),id=new URLSearchParams(location.search).get('id'),p=P.find(x=>x.id===id)||P[0],wa='919839991773';
document.title=p.name+' | Oxmora';$('bc').textContent=p.name;
let rec=[];try{rec=JSON.parse(localStorage.getItem('oxmora_recent')||'[]')}catch(e){}
const others=rec.filter(x=>x!==p.id);try{localStorage.setItem('oxmora_recent',JSON.stringify([p.id,...others].slice(0,8)))}catch(e){}
if(others.length){$('rvbox').style.display='';$('recent').innerHTML=others.slice(0,6).map(findProduct).filter(Boolean).map(productCard).join('')}
window.q=1;window.cq=n=>{q=Math.max(1,Math.min(99,q+n));$('qv').textContent=q};
const rs=getReviews(p.id),av=avgRating(p.id);
$('pd').innerHTML=`<div class="pd-img"><span class="disc">-${disc(p)}%</span><img src="${p.image}" alt="${esc(p.name)}"></div><div><small class="muted">${esc(p.category)} • SKU ${p.id}</small><h1>${esc(p.name)}</h1><div>${stars(av)} <small>${rs.length?av.toFixed(1)+' ('+rs.length+' reviews)':'<a href="#rv">No reviews yet</a>'}</small></div><div class="price2" style="margin:12px 0"><s>${money(p.oldPrice)}</s> ${money(p.price)} <span class="off">Save ${money(p.oldPrice-p.price)} (${disc(p)}% off)</span></div><ul class="hl"><li>${esc(p.category)} from the Oxmora collection</li><li>Ask Oxmora to confirm stock and specifications</li><li>Order quickly on WhatsApp or via checkout</li></ul><div class="qrow"><div class="qty2"><button onclick="cq(-1)">−</button><span id="qv">1</span><button onclick="cq(1)">+</button></div><button class="b1" onclick="addToCart('${p.id}',q)">🛒 Add to cart</button><button class="b2" onclick="addToCart('${p.id}',q);location.href='checkout.html'">Buy Now</button><button class="b3 ${getWish().includes(p.id)?'on':''}" onclick="toggleWish('${p.id}')">♡</button></div><div class="mini"><div><b>🚚</b>Delivery support</div><div><b>🔒</b>Safe payment</div><div><b>✅</b>Genuine product</div></div><p>☎ <a href="tel:+${wa}">+91 9839991773</a> • <a target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent('Hello Oxmora, please share details for '+p.id+' '+p.name)}">Ask about this product on WhatsApp →</a></p></div>`;
const T=[`<p>${esc(p.description)}</p>`,`<table><tr><td>Product</td><td>${esc(p.name)}</td></tr><tr><td>SKU</td><td>${p.id}</td></tr><tr><td>Category</td><td>${esc(p.category)}</td></tr><tr><td>Price</td><td>${money(p.price)} (MRP ${money(p.oldPrice)})</td></tr><tr><td>Other details</td><td>Contact Oxmora to confirm specifications</td></tr></table>`,`<p>Delivery time, charges, exchange and support are confirmed by Oxmora when you place the order. Call or WhatsApp +91 9839991773 for help.</p>`];
const showT=i=>{$('tp').innerHTML=`<div class="tp on">${T[i]}</div>`;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.t===i))};document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showT(+b.dataset.t));showT(0);
const dist=[5,4,3,2,1].map(n=>rs.filter(r=>r.rating===n).length);
$('rsum').innerHTML=`<div class="rsum"><div><div class="big">${rs.length?av.toFixed(1):'–'}</div>${stars(av)}<p class="muted">${rs.length} review${rs.length==1?'':'s'}</p></div><div>${dist.map((c,i)=>`<div class="bar">${5-i}★<i><u style="width:${rs.length?c/rs.length*100:0}%"></u></i>${c}</div>`).join('')}</div><form class="rf" id="rf"><b>Write a review</b><input name="name" required maxlength="40" placeholder="Your name"><select name="rating"><option value="5">★★★★★ Excellent</option><option value="4">★★★★ Good</option><option value="3">★★★ Average</option><option value="2">★★ Poor</option><option value="1">★ Bad</option></select><textarea name="text" required maxlength="400" rows="3" placeholder="Share your experience"></textarea><button class="b1">Submit review</button></form></div><div class="rv-grid" style="margin-top:18px">${rs.map(r=>`<div class="rv">${stars(r.rating)}<p>${esc(r.text)}</p><div class="who"><b>${esc(r.name)}</b><span>${esc(r.date||'')}</span></div></div>`).join('')||'<div class="empty" style="grid-column:1/-1">Be the first to review this product.</div>'}</div>`;
$('rf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);addReview({id:p.id,name:f.get('name'),rating:+f.get('rating'),text:f.get('text'),date:new Date().toISOString().slice(0,10)});initPage()};
$('faq').innerHTML=[['Is this product available right now?','Please contact Oxmora on WhatsApp or phone to confirm stock before ordering.'],['How can I place an order?','Add to cart or Buy Now, complete checkout, and confirm the order with Oxmora on WhatsApp.'],['Do you deliver to my city?','Share your city/PIN code with us on WhatsApp and we will confirm delivery options.'],['Who do I contact for help?','Call or WhatsApp +91 9839991773, or email sk.refrigeration2025@gmail.com.']].map(([a,b])=>`<details><summary>${a}</summary><p>${b}</p></details>`).join('');
$('rel').innerHTML=P.filter(x=>x.id!==p.id&&x.category===p.category).concat(P.filter(x=>x.category!==p.category)).slice(0,6).map(productCard).join('')};
</script></body></html>
